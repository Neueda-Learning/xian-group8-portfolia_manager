<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Manager - Performance</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<main>
    <h1>Portfolio Performance</h1>
    <div id="error" class="error-banner"></div>

    <div class="section">
        <div class="range-selector" id="rangeSelector">
            <button data-range="1M">1M</button>
            <button data-range="3M">3M</button>
            <button data-range="6M">6M</button>
            <button data-range="1Y">1Y</button>
            <button data-range="MAX" class="active">MAX</button>
        </div>
        <div class="chart-wrap">
            <canvas id="performanceChart"></canvas>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Performance Summary</h2>
        </div>
        <div class="ranking-grid">
            <div class="card">
                <div class="label">Top Gainer</div>
                <div class="value positive" id="topGainer">--</div>
            </div>
            <div class="card">
                <div class="label">Top Loser</div>
                <div class="value negative" id="topLoser">--</div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Net Asset Return Fluctuations</h2>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Company</th>
                    <th>Category</th>
                    <th>Shares</th>
                    <th>Purchase Price</th>
                    <th>Current Price</th>
                    <th>Market Value</th>
                    <th>P/L</th>
                    <th>Return</th>
                    <th>Trend</th>
                </tr>
                </thead>
                <tbody id="returnFluctuationBody"></tbody>
            </table>
        </div>
        <div id="returnFluctuationEmpty" class="empty-state" style="display:none;">No holdings yet.</div>
    </div>
</main>

<script src="js/navbar.js"></script>
<script src="js/api.js"></script>
<script>
    renderNavbar("performance");

    let chartInstance = null;

    function formatLabel(isoDate) {
        const d = new Date(isoDate);
        return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "2-digit" });
    }

    function renderChart(points) {
        const labels = points.map(p => formatLabel(p.recordDate));
        const values = points.map(p => p.portfolioValue);

        if (chartInstance) {
            chartInstance.destroy();
        }
        chartInstance = new Chart(document.getElementById("performanceChart"), {
            type: "line",
            data: {
                labels,
                datasets: [{
                    label: "Portfolio Value",
                    data: values,
                    borderColor: "#6366f1",
                    backgroundColor: "rgba(99, 102, 241, 0.15)",
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0,
                    borderWidth: 1.5
                }]
            },
            options: {
                animation: false,
                scales: {
                    x: {
                        ticks: { color: "#94a3b8", maxTicksLimit: 12, autoSkip: true },
                        grid: { color: "#334155" }
                    },
                    y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } }
                },
                plugins: {
                    legend: { labels: { color: "#e2e8f0" } },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `Value: ${formatCurrency(ctx.parsed.y)}`
                        }
                    }
                }
            }
        });
    }

    async function loadPerformance(range) {
        try {
            const points = await Api.getPerformance(range === "MAX" ? undefined : range);
            renderChart(points);
        } catch (e) {
            showError("error", "Failed to load performance history: " + e.message);
        }
    }


    async function loadRanking() {
        try {
            const ranking = await Api.getRanking();
            document.getElementById("topGainer").textContent =
                ranking.topGainerSymbol ? `${ranking.topGainerSymbol}  ${formatPercent(ranking.topGainerRate)}` : "--";
            document.getElementById("topLoser").textContent =
                ranking.topLoserSymbol ? `${ranking.topLoserSymbol}  ${formatPercent(ranking.topLoserRate)}` : "--";
        } catch (e) {
            showError("error", "Failed to load performance ranking: " + e.message);
        }
    }

    /**
     * Renders a per-asset table of net return fluctuations (gain and loss side by
     * side), sorted from biggest gainer to biggest loser, so both positive and
     * negative movements are visible at a glance.
     */
    async function loadReturnFluctuations() {
        try {
            const holdings = await Api.getHoldings();
            const body = document.getElementById("returnFluctuationBody");
            const empty = document.getElementById("returnFluctuationEmpty");
            if (!holdings.length) {
                body.innerHTML = "";
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            const sorted = [...holdings].sort((a, b) => Number(b.profitRate ?? 0) - Number(a.profitRate ?? 0));
            const maxAbsRate = Math.max(0.0001, ...sorted.map(h => Math.abs(Number(h.profitRate ?? 0))));
            body.innerHTML = sorted.map(h => {
                const pl = Number(h.profitLoss ?? 0);
                const rate = Number(h.profitRate ?? 0);
                const cls = pl >= 0 ? "value positive" : "value negative";
                const barCls = pl >= 0 ? "positive" : "negative";
                const sign = pl >= 0 ? "+" : "";
                const barWidth = Math.max(4, Math.round((Math.abs(rate) / maxAbsRate) * 100));
                return `
                    <tr>
                        <td>${h.symbol}</td>
                        <td>${h.companyName}</td>
                        <td>${h.categoryName ?? ""}</td>
                        <td>${h.shares}</td>
                        <td>${formatCurrency(h.purchasePrice)}</td>
                        <td>${formatCurrency(h.currentPrice)}</td>
                        <td>${formatCurrency(h.marketValue)}</td>
                        <td class="${cls}">${sign}${formatCurrency(pl)}</td>
                        <td class="${cls}">${formatPercent(rate)}</td>
                        <td>
                            <div class="trend-cell">
                                <span class="trend-arrow ${barCls}">${pl >= 0 ? "▲" : "▼"}</span>
                                <div class="mini-bar-track">
                                    <div class="mini-bar-fill ${barCls}" style="width:${barWidth}%"></div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");
        } catch (e) {
            showError("error", "Failed to load return fluctuations: " + e.message);
        }
    }

    document.getElementById("rangeSelector").addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-range]");
        if (!btn) return;
        document.querySelectorAll("#rangeSelector button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadPerformance(btn.dataset.range);
    });

    loadPerformance("MAX");
    loadRanking();
    loadReturnFluctuations();
</script>
</body>
</html>
