<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Manager - Asset Categories</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <h1>Asset Categories</h1>
    <div id="error" class="error-banner"></div>

    <div class="section">
        <div class="section-header">
            <h2>Add Asset Category</h2>
        </div>
        <form id="addCategoryForm">
            <div class="form-row">
                <input type="text" id="categoryName" placeholder="Category Name (e.g. Real Estate)">
                <input type="text" id="description" placeholder="Description">
            </div>
            <button type="submit">+ Add Asset</button>
        </form>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Categories</h2>
        </div>
        <table>
            <thead>
            <tr>
                <th>Category</th>
                <th>Description</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="categoriesBody"></tbody>
        </table>
        <div id="categoriesEmpty" class="empty-state" style="display:none;">No categories yet. Add one above.</div>
    </div>
</main>

<script src="js/navbar.js"></script>
<script src="js/api.js"></script>
<script>
    renderNavbar("categories");

    async function loadCategories() {
        try {
            const categories = await Api.getCategories();
            const body = document.getElementById("categoriesBody");
            const empty = document.getElementById("categoriesEmpty");
            clearError("error");
            if (!categories.length) {
                body.innerHTML = "";
                empty.style.display = "block";
                return;
            }
            empty.style.display = "none";
            body.innerHTML = categories.map(c => `
                <tr>
                    <td>${c.categoryName}</td>
                    <td>${c.description ?? ""}</td>
                    <td><button class="danger" onclick="deleteCategory(${c.id})">Delete</button></td>
                </tr>
            `).join("");
        } catch (e) {
            showError("error", "Failed to load asset categories: " + e.message);
        }
    }

    async function deleteCategory(id) {
        if (!confirm("Delete this asset category?")) return;

        const deleteBtn = event?.target;
        if (deleteBtn) deleteBtn.disabled = true;
        clearError("error");

        try {
            await Api.deleteCategory(id);
            await loadCategories();
        } catch (e) {
            // 检查是否是"分类还有持仓"的特殊错误
            if (e.message && (e.message.includes("HAS_HOLDINGS") || e.message.includes("cannot delete category"))) {
                showError("error", "⚠️ Cannot delete category: This category still has holdings. Please delete all holdings in this category first.");
            } else {
                showError("error", "Failed to deltegory: " + e.message);
            }
            if (deleteBtn) deleteBtn.disabled = false;
        }

    }

    document.getElementById("addCategoryForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        clearError("error");

        // Get and trim values
        const categoryNameInput = document.getElementById("categoryName").value.trim();
        const descriptionInput = document.getElementById("description").value.trim();

        // Validate on client side first
        if (!categoryNameInput) {
            showError("error", "Category name cannot be empty");
            return;
        }

        const category = {
            categoryName: categoryNameInput,
            description: descriptionInput
        };

        try {
            await Api.addCategory(category);
            event.target.reset();
            await loadCategories();
        } catch (e) {
            if (e.message && (e.message.includes("DUPLICATE_CATEGORY") || e.message.includes("Category already exists"))) {
                showError("error", "⚠️ This category already exists. Names that only differ by spaces or letter case are treated as duplicates.");
            } else if (e.message && (e.message.includes("VALIDATION_ERROR") || e.message.includes("cannot be empty"))) {
                showError("error", "⚠️ Category name cannot be empty");
            } else {
                showError("error", "Failed to add category: " + e.message);
            }
        }
    });

    loadCategories();
</script>
</body>
</html>
