<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Manager - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<main>
    <h1>Portfolio Overview</h1>
    <div id="error" class="error-banner"></div>

    <div class="grid">
        <div class="card">
            <div class="label">Total Portfolio Value</div>
            <div class="value" id="totalValue">--</div>
        </div>
        <div class="card">
            <div class="label">Total Return</div>
            <div class="value" id="totalReturn">--</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Asset Allocation</h2>
        </div>
        <div class="chart-wrap">
            <canvas id="allocationChart"></canvas>
        </div>
    </div>

    <div class="grid" id="assetCards"></div>

    <div class="section">
        <div class="section-header">
            <h2>Recent Holdings</h2>
            <a class="btn" href="holdings.html">View All</a>
        </div>
        <table>
            <thead>
            <tr>
                <th>Symbol</th>
                <th>Company</th>
                <th>Shares</th>
                <th>Price</th>
                <th>Value</th>
                <th>P/L</th>
            </tr>
            </thead>
            <tbody id="holdingsBody"></tbody>
        </table>
        <div id="holdingsEmpty" class="empty-state" style="display:none;">No holdings yet.</div>
    </div>
</main>

<script src="js/navbar.js"></script>
<script src="js/api.js"></script>
<script>
    renderNavbar("dashboard");

    async function loadDashboard() {
        try {
            const summary = await Api.getDashboard();
            document.getElementById("totalValue").textContent = formatCurrency(summary.totalValue);

            const returnEl = document.getElementById("totalReturn");
            returnEl.textContent = formatPercent(summary.returnRate);
            returnEl.classList.add(summary.returnRate >= 0 ? "positive" : "negative");

            const cards = [
                { label: "Cash Balance", value: summary.cash },
                { label: "Stocks Value", value: summary.stocks },
                { label: "Bonds Value", value: summary.bonds },
                { label: "Crypto Value", value: summary.crypto }
            ];
            document.getElementById("assetCards").innerHTML = cards.map(c => `
                <div class="card">
                    <div class="label">${c.label}</div>
                    <div class="value">${formatCurrency(c.value)}</div>
                </div>
            `).join("");
        } catch (e) {
            showError("error", "Failed to load dashboard summary: " + e.message);
        }
    }

    async function loadAllocation() {
        try {
            const allocation = await Api.getAllocation();
            const labels = Object.keys(allocation);
            const values = Object.values(allocation);

            new Chart(document.getElementById("allocationChart"), {
                type: "doughnut",
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ["#6366f1", "#22c55e", "#f59e0b", "#ef4444", "#06b6d4", "#a855f7"]
                    }]
                },
                options: {
                    plugins: {
                        legend: { position: "bottom", labels: { color: "#e2e8f0" } },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.label}: ${ctx.parsed.toFixed(2)}%`
                            }
                        }
                    }
                }
            });
        } catch (e) {
            showError("error", "Failed to load asset allocation: " + e.message);
        }
    }

    async function loadRecentHoldings() {
        try {
            const holdings = await Api.getHoldings();
            const body = document.getElementById("holdingsBody");
            if (!holdings.length) {
                document.getElementById("holdingsEmpty").style.display = "block";
                return;
            }
            body.innerHTML = holdings.slice(0, 5).map(h => {
                const value = h.shares * h.currentPrice;
                const pl = (h.currentPrice - h.purchasePrice) * h.shares;
                return `
                    <tr>
                        <td>${h.symbol}</td>
                        <td>${h.companyName}</td>
                        <td>${h.shares}</td>
                        <td>${formatCurrency(h.currentPrice)}</td>
                        <td>${formatCurrency(value)}</td>
                        <td class="${pl >= 0 ? "value positive" : "value negative"}">${pl >= 0 ? "+" : ""}${formatCurrency(pl)}</td>
                    </tr>
                `;
            }).join("");
        } catch (e) {
            showError("error", "Failed to load holdings: " + e.message);
        }
    }

    loadDashboard();
    loadAllocation();
    loadRecentHoldings();
</script>
</body>
</html>
