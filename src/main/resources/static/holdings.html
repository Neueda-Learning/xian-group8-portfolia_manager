<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Manager - Holdings</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<main>
    <h1>Your Holdings</h1>
    <div id="error" class="error-banner"></div>

    <div class="section">
        <div class="section-header">
            <h2>Add Holding</h2>
        </div>
        <form id="addHoldingForm">
            <div class="form-row">
                <input type="text" id="symbol" placeholder="Symbol (e.g. AAPL)" required>
                <select id="stockTickerSelect" style="display:none;">
                    <option value="">Select Symbol</option>
                    <option value="C">C</option>
                    <option value="AMZN">AMZN</option>
                    <option value="TSLA">TSLA</option>
                    <option value="FB">FB</option>
                    <option value="AAPL">AAPL</option>
                    <option value="__OTHER__">Other...</option>
                </select>
                <input type="text" id="stockTickerOther" placeholder="Input Other Symbol" style="display:none;">
                <select id="categoryId" required></select>
            </div>
            <div class="form-row">
                <input type="number" step="0.0001" id="shares" placeholder="Shares" required>
                <input type="number" step="0.01" id="purchasePrice" placeholder="Purchase Price" required>
                <input type="number" step="0.01" id="currentPrice" placeholder="Current Price (Auto from API)" readonly>
                <input type="date" id="purchaseDate" required>
            </div>
            <button type="submit">+ Add Holding</button>
        </form>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Holdings</h2>
            <div class="header-actions">
                <select id="holdingCategoryFilter">
                    <option value="">All Types</option>
                </select>
                <button type="button" id="refreshPricesBtn">Refresh Prices</button>
            </div>
        </div>
        <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Symbol</th>
                <th>Company</th>
                <th>Category</th>
                <th>Shares</th>
                <th>Purchase Price</th>
                <th>Current Price</th>
                <th>Value</th>
                <th>P/L</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="holdingsBody"></tbody>
        </table>
        </div>
        <div id="holdingsEmpty" class="empty-state" style="display:none;">No holdings yet. Add one above.</div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>Recent Trades</h2>
            <button type="button" id="reloadTradesBtn" class="secondary">Reload</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Symbol</th>
                    <th>Type</th>
                    <th>Shares</th>
                    <th>Price</th>
                    <th>Amount</th>
                    <th>Cash Change</th>
                    <th>Note</th>
                </tr>
                </thead>
                <tbody id="tradeBody"></tbody>
            </table>
        </div>
        <div id="tradeEmpty" class="empty-state" style="display:none;">No trade records yet.</div>
    </div>

    <div id="tradePanel" class="trade-panel" style="display:none;">
        <div class="trade-panel-card">
            <div class="section-header">
                <h2 id="tradePanelTitle">Trade</h2>
                <button type="button" id="tradePanelCloseBtn" class="secondary">Close</button>
            </div>
            <form id="tradePanelForm">
                <div class="form-row">
                    <input type="text" id="modalSymbol" readonly>
                    <input type="text" id="modalTradeType" readonly>
                </div>
                <div class="form-row">
                    <input type="number" step="0.0001" id="modalTradeShares" placeholder="Trade Shares" required>
                    <input type="number" step="0.01" id="modalTradePrice" placeholder="Trade Price" required>
                    <input type="number" step="0.01" id="modalTradeFee" placeholder="Fee (optional)">
                    <input type="date" id="modalTradeDate" required>
                </div>
                <div class="form-row">
                    <input type="text" id="modalTradeNote" placeholder="Note (optional)">
                </div>
                <div id="tradePanelError" class="error-banner" style="display:none;"></div>
                <div class="form-row">
                    <button type="submit">Submit Trade</button>
                    <button type="button" id="tradePanelCancelBtn" class="secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="js/navbar.js"></script>
<script src="js/api.js"></script>
<script>
    renderNavbar("holdings");
    const CASH_SYMBOL = "USD_CASH";
    const SUPPORTED_TICKERS = new Set(["C", "AMZN", "TSLA", "FB", "AAPL"]);
    let stockCategoryId = null;
    let latestHoldings = [];
    let currentTradeHoldingId = null;
    let currentTradeTypeCode = null;

    function formatNumber(value, digits = 4) {
        const num = Number(value ?? 0);
        return num.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: digits });
    }

    function getAddHoldingSymbol() {
        const categoryId = Number(document.getElementById("categoryId").value || 0);
        if (stockCategoryId !== null && categoryId === stockCategoryId) {
            const selected = (document.getElementById("stockTickerSelect").value || "").trim().toUpperCase();
            if (selected === "__OTHER__") {
                return (document.getElementById("stockTickerOther").value || "").trim().toUpperCase();
            }
            return selected;
        }
        return (document.getElementById("symbol").value || "").trim().toUpperCase();
    }

    function updateAddHoldingSymbolMode() {
        const categoryId = Number(document.getElementById("categoryId").value || 0);
        const isStockCategory = stockCategoryId !== null && categoryId === stockCategoryId;
        const symbolInput = document.getElementById("symbol");
        const stockSelect = document.getElementById("stockTickerSelect");
        const stockOther = document.getElementById("stockTickerOther");

        if (isStockCategory) {
            symbolInput.style.display = "none";
            symbolInput.required = false;
            stockSelect.style.display = "";
            stockSelect.required = true;
        } else {
            symbolInput.style.display = "";
            symbolInput.required = true;
            stockSelect.style.display = "none";
            stockSelect.required = false;
            stockSelect.value = "";
            stockOther.style.display = "none";
            stockOther.value = "";
        }
    }

    function updateAddHoldingSharesPlaceholder() {
        const symbol = getAddHoldingSymbol();
        const sharesInput = document.getElementById("shares");
        sharesInput.placeholder = symbol === CASH_SYMBOL ? "Amount (USD)" : "Shares";
    }

    async function updateAddHoldingCurrentPricePreview() {
        const symbol = getAddHoldingSymbol();
        const currentPriceInput = document.getElementById("currentPrice");
        const isSupportedStock = SUPPORTED_TICKERS.has(symbol);

        if (symbol === CASH_SYMBOL) {
            currentPriceInput.readOnly = true;
            currentPriceInput.value = "0.01";
            return;
        }

        if (isSupportedStock) {
            currentPriceInput.readOnly = true;
            currentPriceInput.value = "";
            try {
                const priceSeries = await Api.getPriceSeries(symbol);
                const closes = Array.isArray(priceSeries?.close) ? priceSeries.close : [];
                if (closes.length) {
                    const latest = closes[closes.length - 1];
                    currentPriceInput.value = String(latest);
                }
            } catch (e) {
                currentPriceInput.value = "";
                showError("error", "Failed to preview current price: " + e.message);
            }
            return;
        }

        // For other symbols, allow manual current price input.
        currentPriceInput.readOnly = false;
        currentPriceInput.placeholder = "Current Price (Manual for other symbols)";
        currentPriceInput.value = "";
    }

    function getTradeButtons(holding) {
        if ((holding.symbol || "").toUpperCase() === CASH_SYMBOL) {
            return `
                <button class="secondary trade-action-btn" onclick="tradeForHolding(${holding.id}, 'DEPOSIT')">Deposit</button>
                <button class="secondary trade-action-btn" onclick="tradeForHolding(${holding.id}, 'WITHDRAW')">Withdraw</button>
            `;
        }
        return `
            <button class="secondary trade-action-btn" onclick="tradeForHolding(${holding.id}, 'BUY')">Buy</button>
            <button class="secondary trade-action-btn" onclick="tradeForHolding(${holding.id}, 'SELL')">Sell</button>
        `;
    }

    function closeTradePanel() {
        document.getElementById("tradePanel").style.display = "none";
        document.body.style.overflow = "";
        document.getElementById("tradePanelError").style.display = "none";
        document.getElementById("tradePanelError").textContent = "";
        document.getElementById("tradePanelForm").reset();
        currentTradeHoldingId = null;
        currentTradeTypeCode = null;
    }

    function openTradePanel(holding, tradeTypeCode) {
        currentTradeHoldingId = holding.id;
        currentTradeTypeCode = tradeTypeCode;
        document.getElementById("tradePanelTitle").textContent = `${tradeTypeCode} ${holding.symbol}`;
        document.getElementById("modalSymbol").value = holding.symbol || "";
        document.getElementById("modalTradeType").value = tradeTypeCode;
        document.getElementById("modalTradeShares").value = "";
        // For cash, price is always 0.01; for non-cash, use current price
        const isCash = (holding.symbol || "").toUpperCase() === CASH_SYMBOL;
        // Update placeholder for cash vs non-cash
        document.getElementById("modalTradeShares").placeholder = isCash ? "Amount (USD)" : "Shares";
        document.getElementById("modalTradePrice").value = String(isCash ? 0.01 : Number(holding.currentPrice || 1));
        document.getElementById("modalTradeFee").value = "0";
        document.getElementById("modalTradeDate").valueAsDate = new Date();
        document.getElementById("tradePanelError").style.display = "none";
        document.getElementById("tradePanel").style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function showTradePanelError(message) {
        const error = document.getElementById("tradePanelError");
        error.textContent = message;
        error.style.display = "block";
    }

    async function loadCategoriesIntoSelect() {
        try {
            const categories = await Api.getCategories();
            const select = document.getElementById("categoryId");
            select.innerHTML = categories.map(c => `<option value="${c.id}">${c.categoryName}</option>`).join("");
            const stockCategory = categories.find(c => String(c.categoryName || "").toLowerCase() === "stock");
            stockCategoryId = stockCategory ? Number(stockCategory.id) : null;

            const categoryFilter = document.getElementById("holdingCategoryFilter");
            const selectedFilter = categoryFilter.value;
            categoryFilter.innerHTML = [
                `<option value="">All Types</option>`,
                ...categories.map(c => `<option value="${c.id}">${c.categoryName}</option>`)
            ].join("");
            if (selectedFilter && categories.some(c => String(c.id) === selectedFilter)) {
                categoryFilter.value = selectedFilter;
            }

            updateAddHoldingSymbolMode();
            updateAddHoldingSharesPlaceholder();
            await updateAddHoldingCurrentPricePreview();
        } catch (e) {
            showError("error", "Failed to load asset categories: " + e.message);
        }
    }

    function getFilteredHoldings() {
        const filterValue = document.getElementById("holdingCategoryFilter").value;
        if (!filterValue) {
            return latestHoldings;
        }
        return latestHoldings.filter(h => String(h.categoryId) === filterValue);
    }

    function renderHoldingsTable() {
        const holdings = getFilteredHoldings();
        const body = document.getElementById("holdingsBody");
        const empty = document.getElementById("holdingsEmpty");
        if (!holdings.length) {
            body.innerHTML = "";
            empty.style.display = "block";
            return;
        }

        empty.style.display = "none";
        body.innerHTML = holdings.map(h => {
            const isCash = (h.symbol || "").toUpperCase() === CASH_SYMBOL;
            // For cash: shares is in cents, display as USD; for others: display as-is
            const displayShares = h.shares;
            const value = h.shares * h.currentPrice;
            const pl = (h.currentPrice - h.purchasePrice) * h.shares;
            return `
                <tr>
                    <td>${h.symbol}</td>
                    <td>${h.companyName}</td>
                    <td>${h.categoryName ?? ""}</td>
                    <td>${displayShares}</td>
                    <td>${formatCurrency(h.purchasePrice)}</td>
                    <td>${formatCurrency(h.currentPrice)}</td>
                    <td>${formatCurrency(value)}</td>
                    <td class="${pl >= 0 ? "value positive" : "value negative"}">${pl >= 0 ? "+" : ""}${formatCurrency(pl)}</td>
                    <td class="action-cell">
                        ${getTradeButtons(h)}
                        <button class="danger trade-action-btn" onclick="deleteHolding(${h.id})">Delete</button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    async function loadHoldings() {
        try {
            const holdings = await Api.getHoldings();
            latestHoldings = holdings;
            if (!holdings.length) {
                document.getElementById("holdingsBody").innerHTML = "";
                document.getElementById("holdingsEmpty").style.display = "block";
                return;
            }
            renderHoldingsTable();
        } catch (e) {
            showError("error", "Failed to load holdings: " + e.message);
        }
    }

    async function loadRecentTrades() {
        try {
            const trades = await Api.getRecentTrades(30);
            const body = document.getElementById("tradeBody");
            const empty = document.getElementById("tradeEmpty");
            if (!trades.length) {
                body.innerHTML = "";
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            body.innerHTML = trades.map(t => {
                const isCash = (t.assetSymbol || "").toUpperCase() === CASH_SYMBOL;
                // For cash: tradeShares is in cents, display as USD; for others: display as-is
                const displayShares = isCash ? (Number(t.tradeShares || 0) / 100).toFixed(2) : formatNumber(t.tradeShares);
                const unitPrice = t.buyPrice ?? t.sellPrice ?? 0;
                const cashClass = Number(t.cashChange) >= 0 ? "value positive" : "value negative";
                return `
                    <tr>
                        <td>${t.tradeDate ?? ""}</td>
                        <td>${t.assetSymbol ?? ""}</td>
                        <td>${t.tradeTypeCode ?? ""}</td>
                        <td>${displayShares}</td>
                        <td>${formatCurrency(unitPrice)}</td>
                        <td>${formatCurrency(t.tradeAmount)}</td>
                        <td class="${cashClass}">${formatCurrency(t.cashChange)}</td>
                        <td>${t.note ?? ""}</td>
                    </tr>
                `;
            }).join("");
        } catch (e) {
            showError("error", "Failed to load trades: " + e.message);
        }
    }

    async function tradeForHolding(id, tradeTypeCode) {
        const holding = latestHoldings.find(h => h.id === id);
        if (!holding) {
            showError("error", "Holding not found.");
            return;
        }
        openTradePanel(holding, tradeTypeCode);
    }

    async function deleteHolding(id) {
        if (!confirm("Delete this holding?")) return;
        try {
            await Api.deleteHolding(id);
            await loadHoldings();
        } catch (e) {
            showError("error", "Failed to delete holding: " + e.message);
        }
    }

    async function refreshPrices() {
        const btn = document.getElementById("refreshPricesBtn");
        btn.disabled = true;
        btn.textContent = "Refreshing...";
        try {
            const result = await Api.refreshHoldingPrices();
            await loadHoldings();
            const skipped = result.skippedUnsupported?.length ?? 0;
            const failed = result.failed?.length ?? 0;
            alert(`Price refresh done. Updated rows: ${result.updatedRows}, skipped: ${skipped}, failed: ${failed}`);
        } catch (e) {
            showError("error", "Failed to refresh prices: " + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "Refresh Prices";
        }
    }

    document.getElementById("addHoldingForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const symbol = getAddHoldingSymbol();
        if (!symbol) {
            showError("error", "Symbol is required.");
            return;
        }

        const currentPriceRaw = document.getElementById("currentPrice").value;
        const currentPrice = currentPriceRaw === "" ? null : Number(currentPriceRaw);
        const holding = {
            symbol,
            categoryId: Number(document.getElementById("categoryId").value),
            shares: Number(document.getElementById("shares").value),
            purchasePrice: Number(document.getElementById("purchasePrice").value),
            currentPrice,
            purchaseDate: document.getElementById("purchaseDate").value
        };
        try {
            await Api.addHolding(holding);
            event.target.reset();
            document.getElementById("stockTickerOther").style.display = "none";
            document.getElementById("currentPrice").readOnly = true;
            document.getElementById("currentPrice").placeholder = "Current Price (Auto from API)";
            updateAddHoldingSymbolMode();
            await loadHoldings();
        } catch (e) {
            showError("error", "Failed to add holding: " + e.message);
        }
    });

    document.getElementById("categoryId").addEventListener("change", async () => {
        updateAddHoldingSymbolMode();
        updateAddHoldingSharesPlaceholder();
        await updateAddHoldingCurrentPricePreview();
    });

    document.getElementById("stockTickerSelect").addEventListener("change", async () => {
        const selected = (document.getElementById("stockTickerSelect").value || "").trim().toUpperCase();
        const otherInput = document.getElementById("stockTickerOther");
        if (selected === "__OTHER__") {
            otherInput.style.display = "";
            otherInput.focus();
        } else {
            otherInput.style.display = "none";
            otherInput.value = "";
        }
        updateAddHoldingSharesPlaceholder();
        await updateAddHoldingCurrentPricePreview();
    });
    document.getElementById("stockTickerOther").addEventListener("input", async () => {
        updateAddHoldingSharesPlaceholder();
        await updateAddHoldingCurrentPricePreview();
    });
    document.getElementById("symbol").addEventListener("input", async () => {
        updateAddHoldingSharesPlaceholder();
        await updateAddHoldingCurrentPricePreview();
    });

    document.getElementById("holdingCategoryFilter").addEventListener("change", renderHoldingsTable);
    document.getElementById("refreshPricesBtn").addEventListener("click", refreshPrices);
    document.getElementById("reloadTradesBtn").addEventListener("click", loadRecentTrades);
    document.getElementById("tradePanelCloseBtn").addEventListener("click", closeTradePanel);
    document.getElementById("tradePanelCancelBtn").addEventListener("click", closeTradePanel);
    document.getElementById("tradePanel").addEventListener("click", (event) => {
        if (event.target.id === "tradePanel") {
            closeTradePanel();
        }
    });

    document.getElementById("tradePanelForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const holding = latestHoldings.find(h => h.id === currentTradeHoldingId);
        if (!holding || !currentTradeTypeCode) {
            showTradePanelError("Trade context is invalid. Please retry.");
            return;
        }

        const tradeShares = Number(document.getElementById("modalTradeShares").value);
        const tradePrice = Number(document.getElementById("modalTradePrice").value);
        const fee = Number(document.getElementById("modalTradeFee").value || 0);
        const tradeDate = (document.getElementById("modalTradeDate").value || "").trim();
        const note = (document.getElementById("modalTradeNote").value || "").trim();

        if (!Number.isFinite(tradeShares) || tradeShares <= 0) {
            showTradePanelError("Shares must be a positive number.");
            return;
        }
        if (!Number.isFinite(tradePrice) || tradePrice <= 0) {
            showTradePanelError("Price must be a positive number.");
            return;
        }
        if (!Number.isFinite(fee) || fee < 0) {
            showTradePanelError("Fee must be >= 0.");
            return;
        }
        if (!tradeDate) {
            showTradePanelError("Trade date is required.");
            return;
        }

        const symbol = (holding.symbol || "").toUpperCase();
        const trade = {
            assetSymbol: symbol,
            tradeTypeCode: currentTradeTypeCode,
            tradeShares,
            tradePrice,
            tradeDate,
            fee,
            note
        };

        try {
            await Api.tradeHolding(trade);
            closeTradePanel();
            await loadHoldings();
            await loadRecentTrades();
        } catch (e) {
            showTradePanelError("Failed to submit trade: " + e.message);
        }
    });

    loadCategoriesIntoSelect();
    updateAddHoldingSymbolMode();
    updateAddHoldingSharesPlaceholder();
    updateAddHoldingCurrentPricePreview();
    loadHoldings();
    loadRecentTrades();
</script>
</body>
</html>
